name: Starter Kit Update

# This file lives in phoenix_starter_kit and gets backported into every child
# repo the normal way (the starter-kit-update skill copies new/changed files
# downstream, same as any other commit). No manual copy step, no separate
# reusable-workflow file to keep in sync — one file, one name, everywhere.
#
# It no-ops in phoenix_starter_kit itself (see the job-level `if:` below),
# since the starter kit doesn't backport into itself. In every child repo it
# runs for real.
#
# One-time setup per child repo (or once at the GitHub org level, so every
# repo inherits them):
#   - Secret APP_UPDATES_CLAUDE_CODE_OAUTH_TOKEN
#       Long-lived token from a Claude Pro/Max subscription, generated by
#       running `claude setup-token` locally (after `claude auth login` with
#       that account). Not an sk-ant- Console API key.
#   - Secret APP_UPDATES_GH_TOKEN        (bot PAT or GitHub App token, repo +
#                                          workflow scope — REQUIRED for CI to
#                                          trigger on the bot's push; without
#                                          it the PR stays draft forever)
#   - Secret SLACK_WEBHOOK_URL           (optional — skips the Slack step if unset)

on:
  schedule:
    - cron: "0 13 * * 1,4" # Monday and Thursday, 13:00 UTC — adjust as needed
  workflow_dispatch:

jobs:
  update:
    name: Backport phoenix_starter_kit
    if: github.repository != 'peek-travel/phoenix_starter_kit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ secrets.APP_UPDATES_GH_TOKEN || secrets.GITHUB_TOKEN }}
      # `secrets` isn't a readable context inside `if:` conditions (actionlint
      # flags it, and GitHub rejects the whole workflow file for it — every
      # push then gets a synthetic failed run with zero jobs). Route it
      # through `env:` instead, which can reference secrets, and check it in
      # plain bash inside the step.
      HAS_BOT_TOKEN: ${{ secrets.APP_UPDATES_GH_TOKEN != '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.APP_UPDATES_CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      BASE_BRANCH: main
      MAX_FIX_ATTEMPTS: 2
      CLAUDE_ALLOWED_TOOLS: "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"
      CLAUDE_MODEL_ARGS: "" # e.g. "--model claude-sonnet-5"
    steps:
      - name: Validate Claude auth token
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::APP_UPDATES_CLAUDE_CODE_OAUTH_TOKEN is not set. This workflow can't run Claude Code without it — generate one with 'claude setup-token' (requires a Claude Pro/Max subscription), set the secret (org-level recommended), and re-run."
            exit 1
          fi
          if [ "${#CLAUDE_CODE_OAUTH_TOKEN}" -lt 20 ]; then
            echo "::error::APP_UPDATES_CLAUDE_CODE_OAUTH_TOKEN looks too short to be a real token. Check the secret value — it should be the exact output of 'claude setup-token'."
            exit 1
          fi

      - name: Warn if no bot token is set
        run: |
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "::warning::APP_UPDATES_GH_TOKEN is not set for this repo. Falling back to GITHUB_TOKEN — the branch push below will NOT trigger this repo's own CI workflow, so 'wait for checks' will find no checks and the PR will stay in draft forever. Add an APP_UPDATES_GH_TOKEN secret (bot PAT or GitHub App token, repo + workflow scope) to fix this."
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.APP_UPDATES_GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "app-updates-bot"
          git config user.email "app-updates-bot@users.noreply.github.com"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-claude-code

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create branch
        id: branch
        run: |
          BRANCH="chore/starter-kit-update-$(date +%Y%m%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run starter-kit-update skill
        run: |
          claude -p "Run the starter-kit-update skill (.claude/skills/starter-kit-update/SKILL.md) to backport the latest phoenix_starter_kit commits into this project.

          Overrides for this automated run:
          - Skip step 1 of the skill (do not run 'git checkout -b'). A branch named ${{ steps.branch.outputs.name }} is already created and checked out — stay on it.
          - Skip the step that runs 'make' locally. This runner has no Elixir/Postgres toolchain — this repo's own CI workflow will run the full test suite against the pushed branch instead, and that result is what gates this PR.
          - Do not push the branch and do not open a pull request yourself. The automation does both of those after you finish.
          - This run is unattended — no human is watching to answer questions. If you would normally stop and ask the user about an ambiguous change, do not abort: skip only that specific change, leave a clear TODO/FIXME comment at the spot identifying exactly what needs a human decision, mention it in your final summary, and continue with everything else.
          - If there are no new commits to backport, make no changes and clearly say so in your final message." \
            --permission-mode bypassPermissions \
            --allowedTools "$CLAUDE_ALLOWED_TOOLS" \
            $CLAUDE_MODEL_ARGS

      - name: Push branch and open draft PR
        id: pr
        run: |
          if [ -z "$(git log "${BASE_BRANCH}"..HEAD --oneline)" ]; then
            echo "had_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new starter kit commits to backport. Nothing to push."
            exit 0
          fi

          # Push HEAD to the intended remote branch name regardless of what's
          # locally checked out — if Claude ever creates a stray local branch
          # despite the override above, this still lands on the right ref.
          git push -u origin HEAD:"${{ steps.branch.outputs.name }}"

          PR_URL=$(gh pr create \
            --draft \
            --base "$BASE_BRANCH" \
            --title "chore: backport phoenix_starter_kit updates" \
            --body "Automated backport of the latest phoenix_starter_kit commits, produced by the \`starter-kit-update\` skill running headlessly in this workflow.

          This PR stays in draft while CI runs. It is marked ready for review automatically once checks pass, or gets a follow-up commit if Claude can fix a failure.")

          echo "had_changes=true" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "number=$(gh pr view "$PR_URL" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Wait for checks, retry fixes on failure
        id: checks
        if: steps.pr.outputs.had_changes == 'true'
        run: |
          # Disabled on purpose: this loop must always reach the final
          # `echo status=...` line, even if a transient `gh`/`git` call
          # fails partway through. Under the default `set -e`, any bare
          # failing command here would abort the step silently and skip
          # both Slack notifications below.
          set +e

          PR="${{ steps.pr.outputs.number }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          ATTEMPT=0
          FINAL_STATUS="unknown"

          wait_for_checks_to_register() {
            for i in $(seq 1 12); do
              COUNT=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null || echo 0)
              [ "$COUNT" -gt 0 ] && break
              sleep 10
            done
          }

          # Give GitHub a moment to register check runs from the push before watching them.
          wait_for_checks_to_register

          while true; do
            gh pr checks "$PR" --watch --interval 30
            if [ "$?" -eq 0 ]; then
              FINAL_STATUS="passed"
              break
            fi

            if [ "$ATTEMPT" -ge "$MAX_FIX_ATTEMPTS" ]; then
              FINAL_STATUS="failed"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))

            echo "Checks failed. Fix attempt $ATTEMPT of $MAX_FIX_ATTEMPTS..."
            CURRENT_SHA=$(git rev-parse HEAD)
            FAILED_LOGS=$(gh run list --branch "$BRANCH" --json databaseId,conclusion,headSha \
                --jq --arg sha "$CURRENT_SHA" '.[] | select(.conclusion=="failure" and .headSha==$sha) | .databaseId' \
              | xargs -r -I{} gh run view {} --log-failed | tail -c 20000)

            claude -p "PR #$PR (branch $BRANCH) has failing CI checks on commit $CURRENT_SHA. Failing logs:

          $FAILED_LOGS

          Diagnose and fix the issues on this branch. Commit the fix. Do not push — the workflow pushes after you finish." \
              --permission-mode bypassPermissions \
              --allowedTools "$CLAUDE_ALLOWED_TOOLS" \
              $CLAUDE_MODEL_ARGS

            if ! git push; then
              echo "::error::git push failed after fix attempt $ATTEMPT"
              FINAL_STATUS="failed"
              break
            fi

            # Wait for the new commit's checks to register before watching again —
            # otherwise gh pr checks can see an empty check set and report success.
            wait_for_checks_to_register
          done

          echo "status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Mark PR ready for review
        if: steps.pr.outputs.had_changes == 'true' && steps.checks.outputs.status == 'passed'
        run: gh pr ready "${{ steps.pr.outputs.number }}"

      - name: Slack notify - success
        if: steps.pr.outputs.had_changes == 'true' && steps.checks.outputs.status == 'passed' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg repo "${{ github.repository }}" --arg url "${{ steps.pr.outputs.url }}" \
              '{text: ":white_check_mark: Starter kit update ready for review in \($repo): \($url)"}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Slack notify - failure
        if: steps.pr.outputs.had_changes == 'true' && steps.checks.outputs.status == 'failed' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg repo "${{ github.repository }}" --arg url "${{ steps.pr.outputs.url }}" \
              '{text: ":x: Starter kit update in \($repo) needs a human — CI is still failing after automated fix attempts: \($url)"}')" \
            "$SLACK_WEBHOOK_URL"
