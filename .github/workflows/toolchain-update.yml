name: Toolchain Update

# Opens (or refreshes) one PR that bumps the versions Dependabot can't see:
# Elixir/Erlang, the Debian base image, esbuild, tailwind and daisyUI. The
# work is in bin/bump-toolchain — run it locally to do the same by hand.
#
# Runs only in phoenix_starter_kit. Child repos get these bumps through the
# normal starter-kit-update backport, so bin/setup removes this file there.
#
# Token: same priority as starter-kit-update.yml (APP_UPDATES_GH_TOKEN →
# ACME_CI_GITHUB_TOKEN → GH_TOKEN), then the built-in GITHUB_TOKEN, so no
# secret is needed here. Pushes made with GITHUB_TOKEN don't trigger Elixir
# CI, so in that case the job dispatches elixir.yml on the PR branch itself
# (workflow_dispatch is the one event GITHUB_TOKEN can still trigger). The
# run is on the PR's head commit, so its checks show up on the PR.
#
# GITHUB_TOKEN also can't push changes to .github/workflows/, so
# bin/bump-toolchain must never edit a workflow file: elixir.yml reads its
# Elixir/OTP versions from .tool-versions instead.

on:
  schedule:
    - cron: "0 13 * * 2" # Tuesday, 13:00 UTC
  workflow_dispatch:

jobs:
  update:
    name: Bump toolchain versions
    if: github.repository == 'peek-travel/phoenix_starter_kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.APP_UPDATES_GH_TOKEN || secrets.ACME_CI_GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
      HAS_BOT_TOKEN: ${{ secrets.APP_UPDATES_GH_TOKEN != '' || secrets.ACME_CI_GITHUB_TOKEN != '' || secrets.GH_TOKEN != '' }}
      BASE_BRANCH: main
      UPDATE_BRANCH: chore/toolchain-update
    steps:
      # Checks out the triggering ref: main on the schedule. Dispatching on
      # another branch (gh workflow run toolchain-update.yml --ref <branch>)
      # tests that branch's bin/bump-toolchain as a dry run, see below.
      - uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}

      - name: Bump versions
        run: bin/bump-toolchain

      - name: Open or update the PR
        run: |
          if git diff --quiet; then
            echo "Everything is up to date."
            exit 0
          fi

          if [ "$GITHUB_REF_NAME" != "$BASE_BRANCH" ]; then
            echo "Dry run on $GITHUB_REF_NAME, not opening a PR:"
            git diff --stat
            exit 0
          fi

          git config user.name "app-updates-bot"
          git config user.email "app-updates-bot@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git commit -am "chore: bump toolchain versions"
          git push --force origin "$UPDATE_BRANCH"

          body=$(printf '%s\n\n```diff\n%s\n```\n' \
            "Automated by .github/workflows/toolchain-update.yml (bin/bump-toolchain). Vendor files changed: $(git diff --name-only HEAD~1 -- assets/vendor | tr '\n' ' ')" \
            "$(git diff HEAD~1 -- .tool-versions .github fly-io config)")

          if gh pr view "$UPDATE_BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$UPDATE_BRANCH" --body "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title "chore: bump toolchain versions" --body "$body"
          fi

          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            gh workflow run elixir.yml --ref "$UPDATE_BRANCH"
          fi
